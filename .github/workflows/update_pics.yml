name: Update pics used in README.md
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - stonks.py
      - requirements.txt
      - .github/workflows/update_pics.yml
  schedule:
    # Hourly, off the top of the hour (GitHub delays and drops runs most at :00)
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: update-pics
  cancel-in-progress: true
jobs:
  update-pics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Update pics
        env:
          POLYGON: ${{ secrets.POLYGON }}
          COIN_GECKO: ${{ secrets.COIN_GECKO }}
        run: |
          # --strict: if any ticker fails, publish nothing and keep the previous charts

          # Default chart (365 days with default tickers)
          python stonks.py --save --format svg --strict

          # 3-day chart with default tickers
          python stonks.py --save --format svg --strict 3

          # 14-day chart with default tickers
          python stonks.py --save --format svg --strict 14

          # BTC and Major Stocks
          python stonks.py --save --format svg --strict 365 BTC X:GOOG X:NVDA X:AAPL X:MSFT
      - name: Publish pics to the charts branch
        # The charts branch is a single commit that every run replaces, so chart
        # updates never rewrite main or grow the repository history.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd pics
          echo "Charts for the README, generated by .github/workflows/update_pics.yml on main. Do not edit." > README.md
          git init -q -b charts
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "chore: update charts $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" charts
